<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cards Project — CSS Design</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page-wrapper">
        <!-- Compact Header -->
        <header class="project-header">
            <span class="sub-badge">Featured Drops</span>
            <h1 class="main-title">Shopping Cards</h1>
        </header>

        <!-- Compact Cards Grid -->
        <div class="cards-container">

            <!-- ================= CARD 1 ================= -->
            <article class="shop-card" data-card="1">
                <!-- Media / Product Image -->
                <div class="card-image-box">
                    <span class="badge badge-sale">-30%</span>
                    <button class="btn-wishlist" type="button" aria-label="Add to wishlist" title="Save to wishlist">
                        <svg class="heart-icon" viewBox="0 0 24 24" stroke-width="2">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                        </svg>
                    </button>

                    <div class="product-visual">
                        <svg viewBox="0 0 260 140" class="shoe-svg" xmlns="http://www.w3.org/2000/svg">
                            <!-- Floor shadow -->
                            <ellipse cx="130" cy="126" rx="95" ry="8" fill="rgba(15,23,42,0.12)"></ellipse>
                            <!-- Outsole base -->
                            <path d="M 28 112 C 40 120 70 122 120 121 C 170 120 215 122 236 114 C 242 110 236 105 225 105 L 36 105 C 26 105 22 108 28 112 Z" fill="#0f172a"></path>
                            <!-- Midsole foam -->
                            <path d="M 34 105 L 226 105 C 230 96 220 90 206 90 L 46 90 C 37 90 32 97 34 105 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"></path>
                            <!-- Air bubble cushion -->
                            <rect x="156" y="93" width="34" height="8" rx="4" fill="#38bdf8" opacity="0.9"></rect>
                            <line x1="168" y1="93" x2="168" y2="101" stroke="#0284c7" stroke-width="1.5"></line>
                            <line x1="178" y1="93" x2="178" y2="101" stroke="#0284c7" stroke-width="1.5"></line>
                            <!-- Upper body -->
                            <path class="shoe-body" d="M 42 90 C 42 74 62 67 88 65 L 118 48 C 132 41 150 50 160 59 L 194 71 C 212 76 218 84 210 90 Z" fill="#ef4444"></path>
                            <!-- Tongue & Collar -->
                            <path d="M 118 48 L 130 28 C 135 24 145 26 150 32 L 161 54 Z" fill="#0f172a"></path>
                            <!-- Front toe guard -->
                            <path d="M 42 90 C 40 80 54 73 75 71 L 70 90 Z" fill="rgba(255,255,255,0.2)"></path>
                            <!-- Dynamic Swoosh -->
                            <path class="shoe-stripe" d="M 82 81 C 114 81 155 68 192 58 C 168 72 130 88 96 88 C 85 88 78 84 82 81 Z" fill="#ffffff"></path>
                            <!-- Laces -->
                            <line x1="126" y1="44" x2="138" y2="52" stroke="#ffffff" stroke-width="3" stroke-linecap="round"></line>
                            <line x1="135" y1="51" x2="148" y2="59" stroke="#ffffff" stroke-width="3" stroke-linecap="round"></line>
                            <line x1="145" y1="58" x2="159" y2="66" stroke="#ffffff" stroke-width="3" stroke-linecap="round"></line>
                        </svg>
                    </div>
                </div>

                <!-- Compact Content -->
                <div class="card-body">
                    <div class="card-header-row">
                        <span class="product-brand">NIKE</span>
                        <div class="product-rating">
                            <span class="star-icon">★</span>
                            <span class="rating-val">4.9</span>
                            <span class="reviews-count">(142)</span>
                        </div>
                    </div>

                    <h2 class="product-title">Nike Air Max Pulse</h2>

                    <!-- Compact Options: Colors & Sizes in one section -->
                    <div class="options-group">
                        <div class="option-item">
                            <span class="option-title">Color</span>
                            <div class="color-options">
                                <button type="button" class="color-btn active" style="--swatch: #ef4444;" data-color="#ef4444" title="Red" aria-label="Red"></button>
                                <button type="button" class="color-btn" style="--swatch: #0f172a;" data-color="#0f172a" title="Black" aria-label="Black"></button>
                                <button type="button" class="color-btn" style="--swatch: #2563eb;" data-color="#2563eb" title="Blue" aria-label="Blue"></button>
                            </div>
                        </div>

                        <div class="option-item">
                            <span class="option-title">Size</span>
                            <div class="size-options">
                                <button type="button" class="size-btn">8</button>
                                <button type="button" class="size-btn active">9</button>
                                <button type="button" class="size-btn">10</button>
                                <button type="button" class="size-btn">11</button>
                            </div>
                        </div>
                    </div>

                    <!-- Price & Action -->
                    <div class="card-footer-row">
                        <div class="price-wrap">
                            <span class="current-price">$149.99</span>
                            <span class="old-price">$199.99</span>
                        </div>
                        <button type="button" class="btn btn-add-cart">
                            <svg class="cart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="9" cy="21" r="1"></circle>
                                <circle cx="20" cy="21" r="1"></circle>
                                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                            </svg>
                            <span>Add</span>
                        </button>
                    </div>
                </div>
            </article>

            <!-- ================= CARD 2 ================= -->
            <article class="shop-card" data-card="2">
                <div class="card-image-box">
                    <span class="badge badge-new">NEW</span>
                    <button class="btn-wishlist" type="button" aria-label="Add to wishlist" title="Save to wishlist">
                        <svg class="heart-icon" viewBox="0 0 24 24" stroke-width="2">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                        </svg>
                    </button>

                    <div class="product-visual">
                        <svg viewBox="0 0 260 140" class="shoe-svg" xmlns="http://www.w3.org/2000/svg">
                            <ellipse cx="130" cy="126" rx="95" ry="8" fill="rgba(15,23,42,0.12)"></ellipse>
                            <path d="M 28 112 C 40 120 70 122 120 121 C 170 120 215 122 236 114 C 242 110 236 105 225 105 L 36 105 C 26 105 22 108 28 112 Z" fill="#0f172a"></path>
                            <path d="M 34 105 L 226 105 C 230 96 220 90 206 90 L 46 90 C 37 90 32 97 34 105 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"></path>
                            <rect x="156" y="93" width="34" height="8" rx="4" fill="#a855f7" opacity="0.9"></rect>
                            <line x1="168" y1="93" x2="168" y2="101" stroke="#7e22ce" stroke-width="1.5"></line>
                            <line x1="178" y1="93" x2="178" y2="101" stroke="#7e22ce" stroke-width="1.5"></line>
                            <path class="shoe-body" d="M 42 90 C 42 74 62 67 88 65 L 118 48 C 132 41 150 50 160 59 L 194 71 C 212 76 218 84 210 90 Z" fill="#2563eb"></path>
                            <path d="M 118 48 L 130 28 C 135 24 145 26 150 32 L 161 54 Z" fill="#0f172a"></path>
                            <path d="M 42 90 C 40 80 54 73 75 71 L 70 90 Z" fill="rgba(255,255,255,0.2)"></path>
                            <path class="shoe-stripe" d="M 82 81 C 114 81 155 68 192 58 C 168 72 130 88 96 88 C 85 88 78 84 82 81 Z" fill="#67e8f9"></path>
                            <line x1="126" y1="44" x2="138" y2="52" stroke="#ffffff" stroke-width="3" stroke-linecap="round"></line>
                            <line x1="135" y1="51" x2="148" y2="59" stroke="#ffffff" stroke-width="3" stroke-linecap="round"></line>
                            <line x1="145" y1="58" x2="159" y2="66" stroke="#ffffff" stroke-width="3" stroke-linecap="round"></line>
                        </svg>
                    </div>
                </div>

                <div class="card-body">
                    <div class="card-header-row">
                        <span class="product-brand">ADIDAS</span>
                        <div class="product-rating">
                            <span class="star-icon">★</span>
                            <span class="rating-val">4.8</span>
                            <span class="reviews-count">(98)</span>
                        </div>
                    </div>

                    <h2 class="product-title">Ultraboost Light 23</h2>

                    <div class="options-group">
                        <div class="option-item">
                            <span class="option-title">Color</span>
                            <div class="color-options">
                                <button type="button" class="color-btn active" style="--swatch: #2563eb;" data-color="#2563eb" title="Blue" aria-label="Blue"></button>
                                <button type="button" class="color-btn" style="--swatch: #059669;" data-color="#059669" title="Green" aria-label="Green"></button>
                                <button type="button" class="color-btn" style="--swatch: #0f172a;" data-color="#0f172a" title="Black" aria-label="Black"></button>
                            </div>
                        </div>

                        <div class="option-item">
                            <span class="option-title">Size</span>
                            <div class="size-options">
                                <button type="button" class="size-btn">8.5</button>
                                <button type="button" class="size-btn active">9.5</button>
                                <button type="button" class="size-btn">10</button>
                                <button type="button" class="size-btn">11</button>
                            </div>
                        </div>
                    </div>

                    <div class="card-footer-row">
                        <div class="price-wrap">
                            <span class="current-price">$179.99</span>
                            <span class="old-price">$210.00</span>
                        </div>
                        <button type="button" class="btn btn-primary btn-add-cart">
                            <svg class="cart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="9" cy="21" r="1"></circle>
                                <circle cx="20" cy="21" r="1"></circle>
                                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                            </svg>
                            <span>Add</span>
                        </button>
                    </div>
                </div>
            </article>

            <!-- ================= CARD 3 ================= -->
            <article class="shop-card" data-card="3">
                <div class="card-image-box">
                    <span class="badge badge-popular">POPULAR</span>
                    <button class="btn-wishlist" type="button" aria-label="Add to wishlist" title="Save to wishlist">
                        <svg class="heart-icon" viewBox="0 0 24 24" stroke-width="2">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                        </svg>
                    </button>

                    <div class="product-visual">
                        <svg viewBox="0 0 260 140" class="shoe-svg" xmlns="http://www.w3.org/2000/svg">
                            <ellipse cx="130" cy="126" rx="95" ry="8" fill="rgba(15,23,42,0.12)"></ellipse>
                            <path d="M 28 112 C 40 120 70 122 120 121 C 170 120 215 122 236 114 C 242 110 236 105 225 105 L 36 105 C 26 105 22 108 28 112 Z" fill="#0f172a"></path>
                            <path d="M 34 105 L 226 105 C 230 96 220 90 206 90 L 46 90 C 37 90 32 97 34 105 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"></path>
                            <rect x="156" y="93" width="34" height="8" rx="4" fill="#f59e0b" opacity="0.9"></rect>
                            <line x1="168" y1="93" x2="168" y2="101" stroke="#d97706" stroke-width="1.5"></line>
                            <line x1="178" y1="93" x2="178" y2="101" stroke="#d97706" stroke-width="1.5"></line>
                            <path class="shoe-body" d="M 42 90 C 42 74 62 67 88 65 L 118 48 C 132 41 150 50 160 59 L 194 71 C 212 76 218 84 210 90 Z" fill="#0f172a"></path>
                            <path d="M 118 48 L 130 28 C 135 24 145 26 150 32 L 161 54 Z" fill="#334155"></path>
                            <path d="M 42 90 C 40 80 54 73 75 71 L 70 90 Z" fill="rgba(255,255,255,0.2)"></path>
                            <path class="shoe-stripe" d="M 82 81 C 114 81 155 68 192 58 C 168 72 130 88 96 88 C 85 88 78 84 82 81 Z" fill="#f59e0b"></path>
                            <line x1="126" y1="44" x2="138" y2="52" stroke="#ffffff" stroke-width="3" stroke-linecap="round"></line>
                            <line x1="135" y1="51" x2="148" y2="59" stroke="#ffffff" stroke-width="3" stroke-linecap="round"></line>
                            <line x1="145" y1="58" x2="159" y2="66" stroke="#ffffff" stroke-width="3" stroke-linecap="round"></line>
                        </svg>
                    </div>
                </div>

                <div class="card-body">
                    <div class="card-header-row">
                        <span class="product-brand">PUMA</span>
                        <div class="product-rating">
                            <span class="star-icon">★</span>
                            <span class="rating-val">4.7</span>
                            <span class="reviews-count">(86)</span>
                        </div>
                    </div>

                    <h2 class="product-title">Nitro Velocity 2</h2>

                    <div class="options-group">
                        <div class="option-item">
                            <span class="option-title">Color</span>
                            <div class="color-options">
                                <button type="button" class="color-btn active" style="--swatch: #0f172a;" data-color="#0f172a" title="Black" aria-label="Black"></button>
                                <button type="button" class="color-btn" style="--swatch: #ea580c;" data-color="#ea580c" title="Orange" aria-label="Orange"></button>
                                <button type="button" class="color-btn" style="--swatch: #84cc16;" data-color="#84cc16" title="Lime" aria-label="Lime"></button>
                            </div>
                        </div>

                        <div class="option-item">
                            <span class="option-title">Size</span>
                            <div class="size-options">
                                <button type="button" class="size-btn">8</button>
                                <button type="button" class="size-btn">9</button>
                                <button type="button" class="size-btn active">10</button>
                                <button type="button" class="size-btn">10.5</button>
                            </div>
                        </div>
                    </div>

                    <div class="card-footer-row">
                        <div class="price-wrap">
                            <span class="current-price">$129.99</span>
                            <span class="old-price">$159.99</span>
                        </div>
                        <button type="button" class="btn btn-primary btn-add-cart">
                            <svg class="cart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="9" cy="21" r="1"></circle>
                                <circle cx="20" cy="21" r="1"></circle>
                                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                            </svg>
                            <span>Add</span>
                        </button>
                    </div>
                </div>
            </article>

        </div>
    </main>

    <!-- Card Interactions JavaScript -->
    <script src="script.js"></script>
</body>
</html>
